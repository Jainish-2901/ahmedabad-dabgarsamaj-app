name: Weekly Dabgar Samaj Directory Backup

on:
  schedule:
    # Runs every Sunday at 04:00 AM IST (22:30 UTC Saturday)
    - cron: '30 22 * * 6'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Export and Email Backup
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          BREVO_SMTP_USER: ${{ secrets.BREVO_SMTP_USER }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          BACKUP_RECIPIENT_EMAIL: ${{ secrets.BACKUP_RECIPIENT_EMAIL }}
        run: node scripts/export-and-email-backup.js
